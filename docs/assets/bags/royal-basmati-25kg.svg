<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="basmatiStudioBg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#2c1a3b" />
      <stop offset="50%" stop-color="#140a1c" />
      <stop offset="100%" stop-color="#060209" />
    </radialGradient>
    <linearGradient id="basmatiTable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24140b" />
      <stop offset="40%" stop-color="#140b06" />
      <stop offset="100%" stop-color="#080402" />
    </linearGradient>
    <radialGradient id="basmatiFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="basmatiSack3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="10%" stop-color="#581c87" />
      <stop offset="25%" stop-color="#7e22ce" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="75%" stop-color="#7e22ce" />
      <stop offset="90%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="basmatiGoldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="basmatiSpecular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#basmatiStudioBg)" />
  <path d="M 0 610 L 600 610 L 600 800 L 0 800 Z" fill="url(#basmatiTable)" />
  <line x1="0" y1="610" x2="600" y2="610" stroke="#451a03" stroke-width="1.5" opacity="0.6" />
  <ellipse cx="300" cy="625" rx="195" ry="28" fill="url(#basmatiFloorShadow)" />

  <g id="royalBasmatiPack">
    <!-- 3D Sack Body -->
    <path d="M 150 90 C 230 82, 370 82, 450 90 C 490 220, 495 440, 470 612 C 400 626, 200 626, 130 612 C 105 440, 110 220, 150 90 Z" fill="url(#basmatiSack3D)" stroke="#2e1065" stroke-width="2" />
    <path d="M 150 90 C 230 82, 370 82, 450 90 C 490 220, 495 440, 470 612 C 400 626, 200 626, 130 612 C 105 440, 110 220, 150 90 Z" fill="url(#basmatiSpecular)" />

    <!-- Top Stitching -->
    <path d="M 144 90 C 230 82, 370 82, 456 90 L 450 108 C 370 100, 230 100, 150 108 Z" fill="#2e1065" />
    <path d="M 148 98 C 230 90, 370 90, 452 98" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6,4" fill="none" />

    <!-- Brand Header -->
    <g transform="translate(300, 150)">
      <rect x="-135" y="-18" width="270" height="36" rx="8" fill="#ca8a04" stroke="url(#basmatiGoldPlate)" stroke-width="2" />
      <text x="0" y="5" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="2">
        ★ ROYAL BIRYANI XXL ★
      </text>
    </g>

    <!-- Main Title Plaque -->
    <g transform="translate(300, 240)">
      <path d="M -145 -36 C -80 -52, 80 -52, 145 -36 C 155 12, 145 50, 135 56 C 70 42, -70 42, -135 56 C -145 50, -155 12, -145 -36 Z" fill="#ffffff" stroke="url(#basmatiGoldPlate)" stroke-width="3" />
      <text x="0" y="8" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="32" font-weight="900" fill="#581c87" letter-spacing="2">
        ROYAL BASMATI
      </text>
      <text x="0" y="32" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#ca8a04" letter-spacing="1">
        ৮.৪ মিমি খাঁটি বিরিয়ানি চাল
      </text>
    </g>

    <!-- Center Art -->
    <g transform="translate(300, 360)">
      <ellipse cx="0" cy="0" rx="125" ry="60" fill="#fef3c7" stroke="url(#basmatiGoldPlate)" stroke-width="2" />
      <!-- Golden Crown & Wheat -->
      <polygon points="0,-35 -20,-15 -10,-10 0,-25 10,-10 20,-15" fill="#ca8a04" stroke="#78350f" stroke-width="1" />
      <rect x="-110" y="12" width="220" height="28" rx="6" fill="#581c87" stroke="#fde047" stroke-width="1.5" />
      <text x="0" y="31" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1">
        AGED 2 YEARS • 8.4 MM GRAIN
      </text>
    </g>

    <!-- Specs -->
    <g transform="translate(300, 455)">
      <rect x="-120" y="-16" width="240" height="32" rx="6" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" />
      <text x="0" y="-1" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="10.5" font-weight="900" fill="#581c87">
        ★ হোটেল ও শাহি বিরিয়ানির সেরা ★
      </text>
      <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#78350f">
        দ্বিগুণ লম্বা দানা • স্বর্গীয় সুবাস • ১০০% নন-স্টিকি
      </text>
    </g>

    <!-- Bottom Stamp -->
    <g transform="translate(300, 530)">
      <g transform="translate(-90, 0)">
        <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
        <text x="0" y="-6" text-anchor="middle" font-size="6" font-weight="bold" fill="#15803d">100% PURE</text>
        <text x="0" y="3" text-anchor="middle" font-size="7.5" font-weight="900" fill="#581c87">BASMATI</text>
        <text x="0" y="11" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#15803d">EXPORT</text>
      </g>
      <g transform="translate(0, 0)">
        <rect x="-52" y="-20" width="104" height="40" rx="6" fill="#581c87" stroke="#fde047" stroke-width="2" />
        <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#fde047">NET WEIGHT</text>
        <text x="0" y="13" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="17" font-weight="900" fill="#ffffff">25 KG / 10 KG</text>
      </g>
      <g transform="translate(90, 0)">
        <circle cx="0" cy="0" r="20" fill="#fde047" stroke="#b45309" stroke-width="1.5" />
        <text x="0" y="-6" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">NATURAL</text>
        <text x="0" y="4" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="8.5" font-weight="900" fill="#581c87">AGED</text>
        <text x="0" y="12" text-anchor="middle" font-size="6" font-weight="bold" fill="#78350f">VINTAGE</text>
      </g>
    </g>
  </g>

  <!-- Grains Foreground -->
  <g transform="translate(300, 690)">
    <ellipse cx="0" cy="22" rx="70" ry="16" fill="url(#basmatiFloorShadow)" />
    <ellipse cx="0" cy="4" rx="66" ry="18" fill="#ca8a04" stroke="#78350f" stroke-width="1.5" />
    <ellipse cx="0" cy="-2" rx="60" ry="14" fill="#fffbeb" stroke="#d97706" stroke-width="1" />
    <g fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5">
      <ellipse cx="-35" cy="-2" rx="12" ry="2" transform="rotate(-15, -35, -2)" />
      <ellipse cx="-15" cy="-5" rx="14" ry="2" transform="rotate(12, -15, -5)" />
      <ellipse cx="8" cy="-3" rx="13" ry="2" transform="rotate(-8, 8, -3)" />
      <ellipse cx="30" cy="-2" rx="12" ry="2" transform="rotate(15, 30, -2)" />
    </g>
  </g>
</svg>
