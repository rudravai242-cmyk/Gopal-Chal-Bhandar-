<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>গোপাল চাল ভাণ্ডার - Gopal Chal Bhandar</title>
    <script>
      // Single Page Apps for GitHub Pages / Custom Domain redirects
      var path = window.location.pathname;
      var query = window.location.search;
      var hash = window.location.hash;
      
      var segments = path.split('/').filter(Boolean);
      var redirectHash = '';
      if (segments.length > 0) {
        var last = segments[segments.length - 1].toLowerCase();
        if (last === 'products' || last === 'rates' || last === 'store') {
          redirectHash = '#' + last;
        }
      }
      
      window.location.replace('/' + (redirectHash || hash));
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">Gopal Chal Bhandar</a>...</p>
  </body>
</html>
