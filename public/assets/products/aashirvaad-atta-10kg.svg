<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- Warm Realistic Studio Spotlight Background -->
    <radialGradient id="aashirvaadStudioLight" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#2a1f18" />
      <stop offset="45%" stop-color="#191310" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>

    <!-- Warm Polished Wooden Table Surface -->
    <linearGradient id="aashirvaadTableWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#291c14" />
      <stop offset="35%" stop-color="#1a110b" />
      <stop offset="100%" stop-color="#0a0705" />
    </linearGradient>

    <!-- Floor Drop Shadow -->
    <radialGradient id="aashirvaadShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Authentic Aashirvaad Cream/Yellowish Sack Gradient -->
    <linearGradient id="attaBagBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="8%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#fef3c7" />
      <stop offset="92%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Plastic Film Specular Gloss Over Pack -->
    <linearGradient id="attaFilmGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="34%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Iconic Aashirvaad Red Banner Gradient -->
    <linearGradient id="aashirvaadRedBanner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="30%" stop-color="#dc2626" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Golden Foil Rim Gradient -->
    <linearGradient id="attaGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- MP Wheat Field Sunset Sky -->
    <linearGradient id="mpFieldSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Clean Dark Background (No artificial banner texts) -->
  <rect width="600" height="800" fill="url(#aashirvaadStudioLight)" />

  <!-- Wooden Studio Table Surface -->
  <path d="M 0 610 L 600 610 L 600 800 L 0 800 Z" fill="url(#aashirvaadTableWood)" />
  <line x1="0" y1="610" x2="600" y2="610" stroke="#443328" stroke-width="1.5" opacity="0.7" />

  <!-- Ground Drop Shadow -->
  <ellipse cx="300" cy="625" rx="180" ry="26" fill="url(#aashirvaadShadow)" />

  <!-- ==================== MAIN AASHIRVAAD 10KG/5KG ATTA PACK ==================== -->
  <g id="aashirvaadPackGroup">
    <!-- Main Poly Sack 3D Bag Contour -->
    <path d="M 160 100 C 230 92, 370 92, 440 100 C 475 220, 480 440, 456 612 C 390 624, 210 624, 144 612 C 120 440, 125 220, 160 100 Z" 
          fill="url(#attaBagBase)" 
          stroke="#b45309" 
          stroke-width="2" />

    <!-- Top Crimped Seal / Machine Stitching -->
    <path d="M 155 100 C 230 92, 370 92, 445 100 L 440 118 C 370 110, 230 110, 160 118 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="1" />
    <path d="M 160 109 C 230 101, 370 101, 440 109" stroke="#fef08a" stroke-width="2" stroke-dasharray="5,3" fill="none" />

    <!-- Poly Plastic Film Specular Gloss Layer -->
    <path d="M 160 100 C 230 92, 370 92, 440 100 C 475 220, 480 440, 456 612 C 390 624, 210 624, 144 612 C 120 440, 125 220, 160 100 Z" 
          fill="url(#attaFilmGloss)" />

    <!-- ITC LOGO & VEG EMBLEM (Top Right of Pack) -->
    <g transform="translate(425, 145)">
      <!-- 100% Veg Symbol -->
      <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" stroke="#16a34a" stroke-width="2" rx="2" />
      <circle cx="0" cy="0" r="5" fill="#16a34a" />
      <!-- ITC Text -->
      <text x="0" y="22" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="8.5" font-weight="900" fill="#dc2626">ITC</text>
    </g>

    <!-- Top Left Slogan: 100% Whole Wheat -->
    <g transform="translate(195, 142)">
      <rect x="-35" y="-10" width="70" height="20" rx="4" fill="#16a34a" stroke="#fef08a" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff">
        100% WHOLE WHEAT
      </text>
    </g>

    <!-- ICONIC RED ARCHED AASHIRVAAD LOGO BANNER -->
    <g transform="translate(300, 215)">
      <!-- Red Curved Oval Plaque -->
      <path d="M -135 -30 C -70 -46, 70 -46, 135 -30 C 145 15, 135 48, 125 52 C 60 40, -60 40, -125 52 C -135 48, -145 15, -135 -30 Z" fill="url(#aashirvaadRedBanner)" stroke="url(#attaGoldFoil)" stroke-width="3" />

      <!-- Inner Fine Golden Line -->
      <path d="M -128 -25 C -65 -39, 65 -39, 128 -25 C 136 12, 128 40, 118 44 C 58 34, -58 34, -118 44 C -128 40, -136 12, -128 -25 Z" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.8" />

      <!-- AASHIRVAAD English Typography in Authentic Arched Impact Lettering -->
      <text x="0" y="10" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="3">
        AASHIRVAAD
      </text>

      <!-- Registered Trademark Circle -->
      <circle cx="120" cy="-8" r="6" fill="#ffffff" />
      <text x="120" y="-5.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#dc2626">®</text>

      <!-- Bengali Title Ribbon Below -->
      <text x="0" y="32" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#fde047" letter-spacing="1">
        আশীর্বাদ শুদ্ধ চাক্কি আটা
      </text>
    </g>

    <!-- MP GOLDEN WHEAT FIELDS & RUSTIC FARM ILLUSTRATION -->
    <g transform="translate(300, 345)">
      <!-- Oval Landscape Window -->
      <clipPath id="farmClip2">
        <ellipse cx="0" cy="0" rx="125" ry="65" />
      </clipPath>

      <ellipse cx="0" cy="0" rx="125" ry="65" fill="url(#mpFieldSunset)" stroke="url(#attaGoldFoil)" stroke-width="2.5" />

      <g clip-path="url(#farmClip2)">
        <!-- Distant MP Rolling Hills -->
        <path d="M -130 10 Q -60 -15 0 8 Q 70 -12 130 12 L 130 70 L -130 70 Z" fill="#ca8a04" />
        <path d="M -130 25 Q -40 5 30 22 Q 90 8 130 28 L 130 70 L -130 70 Z" fill="#854d0e" />

        <!-- Authentic Village Farm Hut Silhouette -->
        <rect x="-85" y="12" width="22" height="14" fill="#451a03" />
        <polygon points="-90,12 -74,2 -58,12" fill="#78350f" />

        <!-- Lush Golden Wheat Sheaves -->
        <g stroke="#fef08a" stroke-width="2">
          <line x1="-30" y1="65" x2="-20" y2="15" />
          <line x1="-15" y1="65" x2="-5" y2="10" />
          <line x1="0" y1="65" x2="0" y2="8" />
          <line x1="15" y1="65" x2="10" y2="12" />
          <line x1="30" y1="65" x2="25" y2="18" />
        </g>
        <circle cx="-20" cy="15" r="4" fill="#fbbf24" />
        <circle cx="-5" cy="10" r="4.5" fill="#fde047" />
        <circle cx="0" cy="8" r="5" fill="#ffffff" />
        <circle cx="10" cy="12" r="4.5" fill="#fde047" />
        <circle cx="25" cy="18" r="4" fill="#fbbf24" />
      </g>

      <!-- Center Ribbon: SHUDDH CHAKKI ATTA -->
      <g transform="translate(0, 52)">
        <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#14532d" stroke="#fef08a" stroke-width="1.5" />
        <text x="0" y="4" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1.5">
          SHUDDH CHAKKI ATTA
        </text>
      </g>
    </g>

    <!-- 4-STEP ADVANTAGE PROCESS / 0% MAIDA PROMISE -->
    <g transform="translate(300, 445)">
      <rect x="-120" y="-16" width="240" height="32" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
      <text x="0" y="-1" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="10.5" font-weight="900" fill="#991b1b">
        ★ 4-STEP ADVANTAGE PROCESS ★
      </text>
      <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#78350f">
        100% সম্পূর্ণ গম • ০% ময়দা • ঘণ্টাব্যাপী নরম রুটি
      </text>
    </g>

    <!-- BOTTOM PACK DETAILS: 10 KG & 5 KG PACKS -->
    <g transform="translate(300, 515)">
      <!-- Left: Agmark Certified Seal -->
      <g transform="translate(-90, 0)">
        <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
        <text x="0" y="-6" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#15803d">AGMARK</text>
        <text x="0" y="3" text-anchor="middle" font-size="8" font-weight="900" fill="#991b1b">GRADE A</text>
        <text x="0" y="11" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#15803d">GOVT OF INDIA</text>
      </g>

      <!-- Center: 10 KG / 5 KG Stamp -->
      <g transform="translate(0, 0)">
        <rect x="-48" y="-18" width="96" height="36" rx="6" fill="#991b1b" stroke="#fef08a" stroke-width="2" />
        <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#fde047">NET QUANTITY</text>
        <text x="0" y="12" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff">10 KG / 5 KG</text>
      </g>

      <!-- Right: Pure Whole Wheat Roti Guarantee -->
      <g transform="translate(90, 0)">
        <circle cx="0" cy="0" r="20" fill="#fde047" stroke="#b45309" stroke-width="1.5" />
        <text x="0" y="-6" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">SUPER</text>
        <text x="0" y="4" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#991b1b">SOFT</text>
        <text x="0" y="12" text-anchor="middle" font-size="6" font-weight="bold" fill="#78350f">ROTIS</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOREGROUND: SOFT ROTIS & FRESH WHEAT ==================== -->
  <g transform="translate(300, 690)">
    <!-- Golden Plate with Soft Puffy Rotis (ফুলকো তুলতুলে রুটি) -->
    <g transform="translate(-130, 0)">
      <ellipse cx="0" cy="22" rx="46" ry="12" fill="url(#aashirvaadShadow)" />
      <ellipse cx="0" cy="5" rx="44" ry="14" fill="#ca8a04" stroke="#78350f" stroke-width="1.5" />
      <ellipse cx="0" cy="-2" rx="38" ry="11" fill="#fffbeb" stroke="#d97706" stroke-width="1" />
      <ellipse cx="-12" cy="-3" rx="4" ry="2" fill="#b45309" opacity="0.6" />
      <ellipse cx="10" cy="-1" rx="5" ry="2" fill="#b45309" opacity="0.5" />
    </g>

    <!-- Whole Wheat Grains in Brass Bowl -->
    <g transform="translate(130, 0)">
      <ellipse cx="0" cy="22" rx="46" ry="12" fill="url(#aashirvaadShadow)" />
      <ellipse cx="0" cy="5" rx="42" ry="13" fill="#b45309" stroke="#78350f" stroke-width="1.5" />
      <ellipse cx="0" cy="-2" rx="38" ry="10" fill="#fde047" stroke="#d97706" stroke-width="1" />
      <circle cx="-16" cy="-2" r="2.2" fill="#92400e" />
      <circle cx="-5" cy="-4" r="2.5" fill="#78350f" />
      <circle cx="8" cy="-2" r="2.2" fill="#92400e" />
      <circle cx="18" cy="-4" r="2.4" fill="#78350f" />
    </g>
  </g>
</svg>
