<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- Background Studio Lighting -->
    <radialGradient id="kgStudioLight2" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#2a1f18" />
      <stop offset="50%" stop-color="#18120e" />
      <stop offset="100%" stop-color="#080605" />
    </radialGradient>

    <!-- Woven Polypropylene Texture -->
    <pattern id="polyWeaveKG2" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#991b1b" />
      <path d="M 0 0 L 3 3 L 6 0 M 0 6 L 3 3 L 6 6" fill="none" stroke="#dc2626" stroke-width="0.75" />
      <path d="M 0 3 L 3 0 L 6 3 M 0 3 L 3 6 L 6 3" fill="none" stroke="#7f1d1d" stroke-width="0.75" />
    </pattern>

    <!-- 3D Red Sack Gradient -->
    <linearGradient id="kgSack3D2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="8%" stop-color="#991b1b" />
      <stop offset="22%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="78%" stop-color="#dc2626" />
      <stop offset="92%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="kgSpecular2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gold Metallic Foil Gradient -->
    <linearGradient id="kgGold2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="kgGoldPlate2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Studio Wooden Floor -->
    <linearGradient id="kgTableWood2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24140b" />
      <stop offset="40%" stop-color="#140b06" />
      <stop offset="100%" stop-color="#080402" />
    </linearGradient>

    <!-- Vector Contact Shadow -->
    <radialGradient id="kgFloorShadow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Clean Background (Zero artificial headers) -->
  <rect width="600" height="800" fill="url(#kgStudioLight2)" />

  <!-- Wooden Floor Surface -->
  <path d="M 0 610 L 600 610 L 600 800 L 0 800 Z" fill="url(#kgTableWood2)" />
  <line x1="0" y1="610" x2="600" y2="610" stroke="#451a03" stroke-width="1.5" opacity="0.6" />

  <!-- Floor Contact Shadow -->
  <ellipse cx="300" cy="625" rx="195" ry="28" fill="url(#kgFloorShadow2)" />

  <!-- ==================== 26 KG BENGAL RATNA / MINIKET RICE SACK ==================== -->
  <g id="riceSackGroup">
    <!-- Main 3D Sack Body with Realistic Natural Bulges -->
    <path d="M 150 90 C 230 82, 370 82, 450 90 C 490 220, 495 440, 470 612 C 400 626, 200 626, 130 612 C 105 440, 110 220, 150 90 Z" 
          fill="url(#kgSack3D2)" 
          stroke="#7f1d1d" 
          stroke-width="2" />

    <!-- PP Woven Fabric Texture Layer -->
    <path d="M 150 90 C 230 82, 370 82, 450 90 C 490 220, 495 440, 470 612 C 400 626, 200 626, 130 612 C 105 440, 110 220, 150 90 Z" 
          fill="url(#polyWeaveKG2)" 
          opacity="0.25" />

    <!-- Specular Light Reflection Streak -->
    <path d="M 150 90 C 230 82, 370 82, 450 90 C 490 220, 495 440, 470 612 C 400 626, 200 626, 130 612 C 105 440, 110 220, 150 90 Z" 
          fill="url(#kgSpecular2)" />

    <!-- TOP BAG STITCHING & ROPE SEAL -->
    <g id="sackTopStitch">
      <path d="M 144 90 C 230 82, 370 82, 456 90 L 450 108 C 370 100, 230 100, 150 108 Z" fill="#7f1d1d" />
      <path d="M 148 98 C 230 90, 370 90, 452 98" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6,4" fill="none" />
      <path d="M 150 103 C 230 95, 370 95, 450 103" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" opacity="0.8" />
    </g>

    <!-- BAG PRINT: TOP BRAND BADGE -->
    <g transform="translate(300, 150)">
      <rect x="-135" y="-18" width="270" height="36" rx="8" fill="#15803d" stroke="url(#kgGoldPlate2)" stroke-width="2" />
      <text x="0" y="5" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="2">
        ★ PREMIUM SORTEX QUALITY ★
      </text>
    </g>

    <!-- ICONIC GOLDEN MEDALLION & BRAND NAME -->
    <g transform="translate(300, 240)">
      <!-- Golden Plaque Background -->
      <path d="M -145 -36 C -80 -52, 80 -52, 145 -36 C 155 12, 145 50, 135 56 C 70 42, -70 42, -135 56 C -145 50, -155 12, -145 -36 Z" 
            fill="#ffffff" 
            stroke="url(#kgGoldPlate2)" 
            stroke-width="3" />

      <!-- Inner Fine Line -->
      <path d="M -138 -30 C -75 -44, 75 -44, 138 -30 C 146 10, 138 42, 128 48 C 65 36, -65 36, -128 48 C -138 42, -146 10, -138 -30 Z" 
            fill="none" 
            stroke="#b45309" 
            stroke-width="1" />

      <!-- Brand Typography -->
      <text x="0" y="8" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#991b1b" letter-spacing="3">
        BENGAL RATNA
      </text>

      <!-- Bengali Subtitle -->
      <text x="0" y="32" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#15803d" letter-spacing="1">
        কালনা স্পেশাল মিনিকেট চাল
      </text>
    </g>

    <!-- CENTER GRAPHIC: GOLDEN GRAIN SHEAVES & SORTEX STAMP -->
    <g transform="translate(300, 360)">
      <!-- Oval Window with Golden Paddy Sheaves -->
      <ellipse cx="0" cy="0" rx="125" ry="60" fill="#fef3c7" stroke="url(#kgGoldPlate2)" stroke-width="2" />
      
      <!-- Paddy Sheaves -->
      <g stroke="#d97706" stroke-width="2">
        <path d="M -50 40 Q -30 -10 -10 -30 Q 0 -35 0 -40" fill="none" />
        <path d="M 50 40 Q 30 -10 10 -30 Q 0 -35 0 -40" fill="none" />
      </g>
      <!-- Grains -->
      <ellipse cx="-20" cy="-20" rx="6" ry="3" fill="#f59e0b" transform="rotate(-30, -20, -20)" />
      <ellipse cx="-10" cy="-32" rx="6" ry="3" fill="#fde047" transform="rotate(-15, -10, -32)" />
      <ellipse cx="0" cy="-40" rx="6" ry="3" fill="#ffffff" />
      <ellipse cx="10" cy="-32" rx="6" ry="3" fill="#fde047" transform="rotate(15, 10, -32)" />
      <ellipse cx="20" cy="-20" rx="6" ry="3" fill="#f59e0b" transform="rotate(30, 20, -20)" />

      <!-- Bold Banner: 100% KALNA MINIKET -->
      <rect x="-110" y="10" width="220" height="28" rx="6" fill="#991b1b" stroke="#fde047" stroke-width="1.5" />
      <text x="0" y="29" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="12.5" font-weight="900" fill="#ffffff" letter-spacing="1">
        MINIKET BOILED RICE
      </text>
    </g>

    <!-- RICE GRAIN FEATURES / SPECIFICATIONS -->
    <g transform="translate(300, 455)">
      <rect x="-120" y="-16" width="240" height="32" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
      <text x="0" y="-1" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="10.5" font-weight="900" fill="#991b1b">
        ★ ঝরঝরে ও সুস্বাদু ভাত ★
      </text>
      <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#78350f">
        ১০০% পাথর ও ধূলিমুক্ত • ১০০% সার্টেক্স ক্লিন
      </text>
    </g>

    <!-- BOTTOM SACK STAMP: 26 KG NET WT & AGMARK -->
    <g transform="translate(300, 530)">
      <!-- Left: Sortex Grade A -->
      <g transform="translate(-90, 0)">
        <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
        <text x="0" y="-6" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#15803d">SORTEX</text>
        <text x="0" y="3" text-anchor="middle" font-size="8" font-weight="900" fill="#991b1b">GRADE A</text>
        <text x="0" y="11" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#15803d">100% CLEAN</text>
      </g>

      <!-- Center: 26 KG NET WT -->
      <g transform="translate(0, 0)">
        <rect x="-52" y="-20" width="104" height="40" rx="6" fill="#991b1b" stroke="#fde047" stroke-width="2" />
        <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#fde047">NET WEIGHT</text>
        <text x="0" y="13" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="17" font-weight="900" fill="#ffffff">26 KG</text>
      </g>

      <!-- Right: Mill Pack Seal -->
      <g transform="translate(90, 0)">
        <circle cx="0" cy="0" r="20" fill="#fde047" stroke="#b45309" stroke-width="1.5" />
        <text x="0" y="-6" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">DIRECT</text>
        <text x="0" y="4" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="8.5" font-weight="900" fill="#991b1b">MILL</text>
        <text x="0" y="12" text-anchor="middle" font-size="6" font-weight="bold" fill="#78350f">SEALED</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOREGROUND: BRASS BOWL WITH RICE GRAINS ==================== -->
  <g transform="translate(300, 690)">
    <!-- Brass Bowl with Long Slender Miniket Grains -->
    <ellipse cx="0" cy="22" rx="70" ry="16" fill="url(#kgFloorShadow2)" />
    <!-- Bowl -->
    <ellipse cx="0" cy="4" rx="66" ry="18" fill="#b45309" stroke="#78350f" stroke-width="1.5" />
    <ellipse cx="0" cy="-2" rx="60" ry="14" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
    
    <!-- Long Slender Translucent White Rice Grains -->
    <g fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5">
      <ellipse cx="-35" cy="-2" rx="9" ry="2.2" transform="rotate(-10, -35, -2)" />
      <ellipse cx="-20" cy="-6" rx="10" ry="2.4" transform="rotate(15, -20, -6)" />
      <ellipse cx="-5" cy="-3" rx="11" ry="2.5" transform="rotate(-5, -5, -3)" />
      <ellipse cx="12" cy="-5" rx="10" ry="2.4" transform="rotate(20, 12, -5)" />
      <ellipse cx="30" cy="-2" rx="9" ry="2.2" transform="rotate(-15, 30, -2)" />
      <ellipse cx="-15" cy="1" rx="10" ry="2.3" transform="rotate(-20, -15, 1)" />
      <ellipse cx="5" cy="2" rx="11" ry="2.4" transform="rotate(10, 5, 2)" />
      <ellipse cx="22" cy="1" rx="9" ry="2.2" transform="rotate(5, 22, 1)" />
    </g>
  </g>
</svg>
