<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- Background Studio Lighting -->
    <radialGradient id="gbStudioLight2" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#142c1e" />
      <stop offset="50%" stop-color="#0a1810" />
      <stop offset="100%" stop-color="#040906" />
    </radialGradient>

    <!-- Woven Green PP Bag Texture -->
    <pattern id="polyWeaveGreen2" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#14532d" />
      <path d="M 0 0 L 3 3 L 6 0 M 0 6 L 3 3 L 6 6" fill="none" stroke="#16a34a" stroke-width="0.75" />
      <path d="M 0 3 L 3 0 L 6 3 M 0 3 L 3 6 L 6 3" fill="none" stroke="#0f3d20" stroke-width="0.75" />
    </pattern>

    <!-- 3D Emerald Green Sack Gradient -->
    <linearGradient id="gbSack3D2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="8%" stop-color="#14532d" />
      <stop offset="22%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="78%" stop-color="#15803d" />
      <stop offset="92%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="gbSpecular2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="gbGoldPlate2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Wooden Floor -->
    <linearGradient id="gbTableWood2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1814" />
      <stop offset="40%" stop-color="#120e0b" />
      <stop offset="100%" stop-color="#080605" />
    </linearGradient>

    <!-- Contact Shadow -->
    <radialGradient id="gbFloorShadow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Clean Dark Background (Zero artificial headers) -->
  <rect width="600" height="800" fill="url(#gbStudioLight2)" />

  <!-- Wooden Floor Surface -->
  <path d="M 0 610 L 600 610 L 600 800 L 0 800 Z" fill="url(#gbTableWood2)" />
  <line x1="0" y1="610" x2="600" y2="610" stroke="#374151" stroke-width="1.5" opacity="0.6" />

  <!-- Floor Contact Shadow -->
  <ellipse cx="300" cy="625" rx="195" ry="28" fill="url(#gbFloorShadow2)" />

  <!-- ==================== 26 KG GREEN STARLINE GOBINDOBHOG SACK ==================== -->
  <g id="gobindobhogSackGroup">
    <!-- Main Sack Shape -->
    <path d="M 150 90 C 230 82, 370 82, 450 90 C 490 220, 495 440, 470 612 C 400 626, 200 626, 130 612 C 105 440, 110 220, 150 90 Z" 
          fill="url(#gbSack3D2)" 
          stroke="#052e16" 
          stroke-width="2" />

    <!-- PP Woven Fabric Texture Layer -->
    <path d="M 150 90 C 230 82, 370 82, 450 90 C 490 220, 495 440, 470 612 C 400 626, 200 626, 130 612 C 105 440, 110 220, 150 90 Z" 
          fill="url(#polyWeaveGreen2)" 
          opacity="0.25" />

    <!-- Specular Highlight -->
    <path d="M 150 90 C 230 82, 370 82, 450 90 C 490 220, 495 440, 470 612 C 400 626, 200 626, 130 612 C 105 440, 110 220, 150 90 Z" 
          fill="url(#gbSpecular2)" />

    <!-- TOP BAG STITCHING -->
    <g id="gbSackTopStitch">
      <path d="M 144 90 C 230 82, 370 82, 456 90 L 450 108 C 370 100, 230 100, 150 108 Z" fill="#052e16" />
      <path d="M 148 98 C 230 90, 370 90, 452 98" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6,4" fill="none" />
      <path d="M 150 103 C 230 95, 370 95, 450 103" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" opacity="0.8" />
    </g>

    <!-- BAG PRINT: TOP BRAND BADGE -->
    <g transform="translate(300, 150)">
      <rect x="-135" y="-18" width="270" height="36" rx="8" fill="#ca8a04" stroke="url(#gbGoldPlate2)" stroke-width="2" />
      <text x="0" y="5" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="2">
        ★ GREEN STARLINE MAMA RICE ★
      </text>
    </g>

    <!-- ICONIC GOLDEN MEDALLION & BRAND NAME -->
    <g transform="translate(300, 240)">
      <!-- Golden Plaque Background -->
      <path d="M -145 -36 C -80 -52, 80 -52, 145 -36 C 155 12, 145 50, 135 56 C 70 42, -70 42, -135 56 C -145 50, -155 12, -145 -36 Z" 
            fill="#ffffff" 
            stroke="url(#gbGoldPlate2)" 
            stroke-width="3" />

      <!-- Inner Fine Line -->
      <path d="M -138 -30 C -75 -44, 75 -44, 138 -30 C 146 10, 138 42, 128 48 C 65 36, -65 36, -128 48 C -138 42, -146 10, -138 -30 Z" 
            fill="none" 
            stroke="#15803d" 
            stroke-width="1" />

      <!-- Brand Typography -->
      <text x="0" y="8" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="32" font-weight="900" fill="#14532d" letter-spacing="2">
        GOBINDO BHOG
      </text>

      <!-- Bengali Subtitle -->
      <text x="0" y="32" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#b45309" letter-spacing="1">
        খাঁটি সুগন্ধি গোবিন্দভোগ চাল
      </text>
    </g>

    <!-- CENTER GRAPHIC: LORD KRISHNA FLUTE / TEMPLE PRASAD EMBLEM -->
    <g transform="translate(300, 360)">
      <ellipse cx="0" cy="0" rx="125" ry="60" fill="#fef3c7" stroke="url(#gbGoldPlate2)" stroke-width="2" />
      
      <!-- Peacock Feather / Golden Flute Symbol -->
      <g stroke="#ca8a04" stroke-width="2">
        <line x1="-40" y1="15" x2="40" y2="-15" stroke-width="3" stroke="#b45309" />
        <circle cx="25" cy="-22" r="8" fill="#15803d" />
        <circle cx="25" cy="-22" r="4" fill="#0284c7" />
        <circle cx="25" cy="-22" r="1.5" fill="#fde047" />
      </g>

      <!-- Bold Banner: SUPREME AROMA -->
      <rect x="-110" y="12" width="220" height="28" rx="6" fill="#14532d" stroke="#fde047" stroke-width="1.5" />
      <text x="0" y="31" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1">
        NATURAL ROYAL AROMA
      </text>
    </g>

    <!-- SPECIFICATIONS -->
    <g transform="translate(300, 455)">
      <rect x="-120" y="-16" width="240" height="32" rx="6" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" />
      <text x="0" y="-1" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="10.5" font-weight="900" fill="#14532d">
        ★ পায়েস, খিচুড়ি ও ভোগ স্পেশাল ★
      </text>
      <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#78350f">
        মনমাতানো প্রাকৃতিক সুবাস • ১০০% আসল নতুন চাল
      </text>
    </g>

    <!-- BOTTOM SACK STAMP: 26 KG NET WT -->
    <g transform="translate(300, 530)">
      <!-- Left: Aroma Certified -->
      <g transform="translate(-90, 0)">
        <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
        <text x="0" y="-6" text-anchor="middle" font-size="6" font-weight="bold" fill="#15803d">100% PURE</text>
        <text x="0" y="3" text-anchor="middle" font-size="7.5" font-weight="900" fill="#14532d">AROMATIC</text>
        <text x="0" y="11" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#15803d">PRASADAM</text>
      </g>

      <!-- Center: 26 KG NET WT -->
      <g transform="translate(0, 0)">
        <rect x="-52" y="-20" width="104" height="40" rx="6" fill="#14532d" stroke="#fde047" stroke-width="2" />
        <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#fde047">NET WEIGHT</text>
        <text x="0" y="13" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="17" font-weight="900" fill="#ffffff">26 KG</text>
      </g>

      <!-- Right: Mill Pack Seal -->
      <g transform="translate(90, 0)">
        <circle cx="0" cy="0" r="20" fill="#fde047" stroke="#b45309" stroke-width="1.5" />
        <text x="0" y="-6" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">SPECIAL</text>
        <text x="0" y="4" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="8.5" font-weight="900" fill="#14532d">SWEET</text>
        <text x="0" y="12" text-anchor="middle" font-size="6" font-weight="bold" fill="#78350f">PAYESH</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOREGROUND: PEARL WHITE GOBINDOBHOG GRAINS ==================== -->
  <g transform="translate(300, 690)">
    <ellipse cx="0" cy="22" rx="70" ry="16" fill="url(#gbFloorShadow2)" />
    <ellipse cx="0" cy="4" rx="66" ry="18" fill="#ca8a04" stroke="#78350f" stroke-width="1.5" />
    <ellipse cx="0" cy="-2" rx="60" ry="14" fill="#fffbeb" stroke="#d97706" stroke-width="1" />
    
    <!-- Tiny Round Aromatic Pearl-like Grains -->
    <g fill="#ffffff" stroke="#e5e7eb" stroke-width="0.5">
      <ellipse cx="-30" cy="-2" rx="5" ry="3.5" transform="rotate(-10, -30, -2)" />
      <ellipse cx="-15" cy="-5" rx="5.5" ry="3.8" transform="rotate(15, -15, -5)" />
      <ellipse cx="0" cy="-3" rx="5" ry="3.6" transform="rotate(-5, 0, -3)" />
      <ellipse cx="15" cy="-5" rx="5.5" ry="3.7" transform="rotate(20, 15, -5)" />
      <ellipse cx="30" cy="-2" rx="5" ry="3.5" transform="rotate(-15, 30, -2)" />
      <ellipse cx="-8" cy="2" rx="5.2" ry="3.6" transform="rotate(10, -8, 2)" />
      <ellipse cx="8" cy="2" rx="5.2" ry="3.6" transform="rotate(-10, 8, 2)" />
    </g>
  </g>
</svg>
