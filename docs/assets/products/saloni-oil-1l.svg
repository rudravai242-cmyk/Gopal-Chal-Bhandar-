<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- Neutral Premium Dark Studio Backdrop -->
    <radialGradient id="saloniStudioBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#242b35" />
      <stop offset="50%" stop-color="#141922" />
      <stop offset="100%" stop-color="#080b0f" />
    </radialGradient>

    <!-- Studio Floor Reflection Surface -->
    <linearGradient id="studioDarkSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2029" />
      <stop offset="40%" stop-color="#10141a" />
      <stop offset="100%" stop-color="#06080b" />
    </linearGradient>

    <!-- Pouch Realistic Contact Shadow -->
    <radialGradient id="pouchShadowReal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#000000" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Authentic Saloni Vibrant Yellow Pouch Film Gradient -->
    <linearGradient id="pouchYellow3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="8%" stop-color="#eab308" />
      <stop offset="22%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#fffbeb" />
      <stop offset="65%" stop-color="#fde047" />
      <stop offset="88%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Ultra-realistic Plastic Foil Gloss Streak -->
    <linearGradient id="pouchGlossHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Saloni Red Brand Bar -->
    <linearGradient id="saloniRedLogo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="80%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Pure Amber Mustard Oil Glow -->
    <radialGradient id="oilAmberGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
  </defs>

  <!-- Clean Studio Environment (Zero artificial headers) -->
  <rect width="600" height="800" fill="url(#saloniStudioBg)" />

  <!-- Studio Surface -->
  <path d="M 0 620 L 600 620 L 600 800 L 0 800 Z" fill="url(#studioDarkSurface)" />
  <line x1="0" y1="620" x2="600" y2="620" stroke="#2a3342" stroke-width="1" opacity="0.4" />

  <!-- Natural Ground Drop Shadow -->
  <ellipse cx="300" cy="635" rx="170" ry="26" fill="url(#pouchShadowReal)" />

  <!-- ==================== REALISTIC 1 LITRE SALONI POUCH ==================== -->
  <g id="saloni1LPouch" transform="translate(0, 0)">
    <!-- Main Pillow Pouch 3D Shape -->
    <path d="M 170 110 C 235 102, 365 102, 430 110 C 475 240, 480 470, 440 625 C 375 634, 225 634, 160 625 C 120 470, 125 240, 170 110 Z" 
          fill="url(#pouchYellow3D)" 
          stroke="#a16207" 
          stroke-width="1.5" />

    <!-- Top Crimped Heat Seal -->
    <path d="M 162 110 C 235 102, 365 102, 438 110 L 434 128 C 365 120, 235 120, 166 128 Z" fill="#ca8a04" stroke="#854d0e" stroke-width="1" />
    <!-- Heat Seal Ridges -->
    <path d="M 166 118 C 235 110, 365 110, 434 118" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,2" fill="none" opacity="0.8" />
    <path d="M 168 123 C 235 115, 365 115, 432 123" stroke="#854d0e" stroke-width="1.5" stroke-dasharray="3,2" fill="none" opacity="0.6" />

    <!-- Bottom Crimped Heat Seal -->
    <path d="M 154 610 C 225 618, 375 618, 446 610 L 440 628 C 375 636, 225 636, 160 628 Z" fill="#a16207" stroke="#713f12" stroke-width="1" />

    <!-- Poly Plastic Film Specular Gloss Layer -->
    <path d="M 170 110 C 235 102, 365 102, 430 110 C 475 240, 480 470, 440 625 C 375 634, 225 634, 160 625 C 120 470, 125 240, 170 110 Z" 
          fill="url(#pouchGlossHighlight)" />

    <!-- Top Green Guarantee Banner -->
    <g transform="translate(300, 155)">
      <rect x="-115" y="-12" width="230" height="24" rx="4" fill="#15803d" stroke="#fef08a" stroke-width="1" />
      <text x="0" y="4.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="1">
        ★ 100% PURE &amp; NATURAL ★
      </text>
      <text x="0" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#713f12">
        AGMARK GRADE 1 • কাচ্চি ঘানি সরিষার তেল
      </text>
    </g>

    <!-- ICONIC SALONI RED RECTANGULAR LOGO -->
    <g transform="translate(300, 220)">
      <!-- Red Box with Golden Rim -->
      <rect x="-110" y="-28" width="220" height="56" rx="6" fill="url(#saloniRedLogo)" stroke="#fef08a" stroke-width="2.5" />
      
      <!-- Crisp White SALONI Typography -->
      <text x="-6" y="9" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="4">
        SALONI
      </text>
      
      <!-- Registered Mark -->
      <circle cx="92" cy="-10" r="6" fill="#ffffff" />
      <text x="92" y="-7.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#dc2626">®</text>

      <!-- Bengali Sub-title in Yellow -->
      <text x="0" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fde047">
        সালোনি সরিষার তেল
      </text>
    </g>

    <!-- TRADITIONAL SALONI LADY MASCOT LOGO MEDALLION -->
    <g transform="translate(300, 320)">
      <!-- Outer Double Golden Rings -->
      <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#eab308" stroke-width="4" />
      <circle cx="0" cy="0" r="48" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />

      <!-- Red Ghunghat / Veil -->
      <path d="M -36 12 C -38 -28, 38 -28, 36 12 C 26 34, -26 34, -36 12 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" />

      <!-- Golden Border of Ghunghat -->
      <path d="M -30 2 C -32 -22, 32 -22, 30 2" fill="none" stroke="#fde047" stroke-width="2.5" />

      <!-- Woman's Face -->
      <ellipse cx="0" cy="6" rx="20" ry="21" fill="#fed7aa" />

      <!-- Black Hair -->
      <path d="M -18 2 C -10 -8, 10 -8, 18 2 C 14 -3, -14 -3, -18 2 Z" fill="#1c1917" />

      <!-- Traditional Red Bindi -->
      <circle cx="0" cy="2" r="3.5" fill="#dc2626" />

      <!-- Expressive Eyes -->
      <ellipse cx="-7" cy="8" rx="3.5" ry="2" fill="#1c1917" />
      <ellipse cx="7" cy="8" rx="3.5" ry="2" fill="#1c1917" />
      <circle cx="-6.5" cy="7.5" r="1" fill="#ffffff" />
      <circle cx="7.5" cy="7.5" r="1" fill="#ffffff" />

      <!-- Gentle Smiling Lips -->
      <path d="M -5 18 Q 0 23 5 18" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />

      <!-- Nose Ring (Nath) -->
      <circle cx="4" cy="13" r="2.5" fill="none" stroke="#eab308" stroke-width="1" />
    </g>

    <!-- KACCHI GHANI BOLD TITLE -->
    <g transform="translate(300, 405)">
      <text x="0" y="0" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="25" font-weight="900" fill="#991b1b" letter-spacing="2">
        KACCHI GHANI
      </text>
      <text x="0" y="18" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#78350f" letter-spacing="1.5">
        PURE MUSTARD OIL
      </text>
      <text x="0" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">
        তীব্র ঝাঁঝ ও প্রাকৃতিক স্বাদ
      </text>
    </g>

    <!-- BOTTOM PACK BADGES: AGMARK + 1 LITRE + 100% VEG -->
    <g transform="translate(300, 485)">
      <!-- Agmark Grade 1 Seal (Left) -->
      <g transform="translate(-85, 0)">
        <circle cx="0" cy="0" r="19" fill="#ffffff" stroke="#15803d" stroke-width="2" />
        <text x="0" y="-5" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#15803d">AGMARK</text>
        <text x="0" y="4" text-anchor="middle" font-size="8" font-weight="900" fill="#991b1b">GRADE 1</text>
        <text x="0" y="11" text-anchor="middle" font-size="5" font-weight="bold" fill="#15803d">CA-18355</text>
      </g>

      <!-- 1 LITRE Net Volume Seal (Center) -->
      <g transform="translate(0, 0)">
        <rect x="-42" y="-16" width="84" height="32" rx="4" fill="#15803d" stroke="#fef08a" stroke-width="1.5" />
        <text x="0" y="-3" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#fef08a">NET VOLUME</text>
        <text x="0" y="11" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff">1 LITRE</text>
      </g>

      <!-- Green Dot Veg Symbol (Right) -->
      <g transform="translate(85, 0)">
        <rect x="-14" y="-14" width="28" height="28" fill="#ffffff" stroke="#15803d" stroke-width="2" rx="3" />
        <circle cx="0" cy="0" r="7" fill="#15803d" />
        <text x="0" y="22" text-anchor="middle" font-size="6.5" font-weight="bold" fill="#713f12">100% VEG</text>
      </g>
    </g>

    <!-- Nutrition / Purity Bar at bottom of pack -->
    <g transform="translate(300, 550)">
      <rect x="-110" y="-12" width="220" height="24" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#92400e">
        NATURAL OMEGA 3 &amp; 6 • CHOLESTEROL FREE
      </text>
    </g>
  </g>

  <!-- ==================== FOREGROUND: MUSTARD OIL BOWL & SEEDS ==================== -->
  <g transform="translate(300, 680)">
    <!-- Amber Mustard Oil Brass Katori (Left) -->
    <g transform="translate(-110, 0)">
      <!-- Drop Shadow -->
      <ellipse cx="0" cy="18" rx="42" ry="10" fill="url(#pouchShadowReal)" />
      <!-- Brass Bowl Outer Rim -->
      <ellipse cx="0" cy="2" rx="40" ry="14" fill="#b45309" stroke="#78350f" stroke-width="1.5" />
      <!-- Glowing Pure Amber Mustard Oil -->
      <ellipse cx="0" cy="-2" rx="36" ry="11" fill="url(#oilAmberGlow)" />
      <!-- Specular Highlight on Oil -->
      <ellipse cx="-8" cy="-5" rx="14" ry="4" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Pile of Fresh Mustard Seeds (Right) -->
    <g transform="translate(110, 0)">
      <!-- Drop Shadow -->
      <ellipse cx="0" cy="18" rx="42" ry="10" fill="url(#pouchShadowReal)" />
      <!-- Clay Dish -->
      <ellipse cx="0" cy="2" rx="38" ry="12" fill="#78350f" />
      <ellipse cx="0" cy="-2" rx="34" ry="9" fill="#451a03" />
      <!-- Mustard Seeds Grains -->
      <circle cx="-12" cy="-4" r="2.5" fill="#facc15" />
      <circle cx="-6" cy="-2" r="2.2" fill="#78350f" />
      <circle cx="0" cy="-5" r="2.6" fill="#f59e0b" />
      <circle cx="6" cy="-3" r="2.4" fill="#451a03" />
      <circle cx="12" cy="-4" r="2.3" fill="#facc15" />
      <circle cx="-2" cy="0" r="2" fill="#92400e" />
      <circle cx="8" cy="0" r="2.2" fill="#d97706" />
    </g>
  </g>
</svg>
