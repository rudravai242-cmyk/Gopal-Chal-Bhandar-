<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- Warm Earthy Studio Spotlight -->
    <radialGradient id="attaStudioLight" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="55%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>

    <!-- Table Wood -->
    <linearGradient id="attaTableWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="40%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#050404" />
    </linearGradient>

    <!-- Atta Bag Matte Poly Texture & 3D Gradient -->
    <linearGradient id="attaBag3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="12%" stop-color="#b45309" />
      <stop offset="28%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="72%" stop-color="#d97706" />
      <stop offset="88%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Jute Weave Pattern Overlay -->
    <pattern id="juteWeavePattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#fef3c7" />
      <path d="M 0 0 L 3 3 L 6 0 M 0 6 L 3 3 L 6 6" fill="none" stroke="#fde68a" stroke-width="0.8" />
      <path d="M 0 3 L 3 0 L 6 3 M 0 3 L 3 6 L 6 3" fill="none" stroke="#d97706" stroke-width="0.6" />
    </pattern>

    <!-- Gold Foil Inks -->
    <linearGradient id="attaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Contact Shadow -->
    <radialGradient id="attaShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#attaStudioLight)" />

  <!-- Wooden Table Surface -->
  <path d="M 0 580 L 600 580 L 600 800 L 0 800 Z" fill="url(#attaTableWood)" />
  <line x1="0" y1="580" x2="600" y2="580" stroke="#44403c" stroke-width="1.5" opacity="0.6" />

  <!-- Header -->
  <g>
    <text x="300" y="68" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#fef08a" letter-spacing="2">
      GOPAL CHAL BHANDAR • KALNA
    </text>
    <text x="300" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e7e5e4" letter-spacing="1.5">
      100% MP SHARBATI CHAKKI FRESH WHOLE WHEAT ATTA
    </text>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="595" rx="180" ry="22" fill="url(#attaShadow)" />

  <!-- ==================== MAIN ATTA SACK (10 KG / 5 KG) ==================== -->
  <g id="attaSackGroup">
    <!-- Bag Outer Contour (Heavy Sack Bulge) -->
    <path d="M 155 160 C 220 152, 380 152, 445 160 C 475 270, 480 430, 462 580 C 400 592, 200 592, 138 580 C 120 430, 125 270, 155 160 Z" fill="url(#attaBag3D)" stroke="#78350f" stroke-width="2" />

    <!-- Poly Jute Texture Inset -->
    <path d="M 155 160 C 220 152, 380 152, 445 160 C 475 270, 480 430, 462 580 C 400 592, 200 592, 138 580 C 120 430, 125 270, 155 160 Z" fill="url(#juteWeavePattern)" opacity="0.25" />

    <!-- Top Machine Stitched Sealing Hem -->
    <path d="M 150 160 C 220 150, 380 150, 450 160 L 448 174 C 380 164, 220 164, 152 174 Z" fill="#451a03" stroke="#292524" stroke-width="1" />
    <path d="M 154 167 C 220 158, 380 158, 446 167" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6,4" fill="none" opacity="0.9" />

    <!-- CENTER PRINTED ARTWORK CONTAINER (Clean Beige Plate) -->
    <g transform="translate(300, 355)">
      <path d="M -125 -130 Q 0 -140 125 -130 Q 138 20 125 140 Q 0 150 -125 140 Q -138 20 -125 -130 Z" fill="#fffbeb" stroke="#b45309" stroke-width="2.5" />

      <!-- Top Red Banner: 100% SHARBATI WHEAT -->
      <g transform="translate(0, -96)">
        <rect x="-105" y="-18" width="210" height="36" rx="6" fill="#991b1b" stroke="#fef08a" stroke-width="1.5" />
        <text x="0" y="6" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="2">
          MP SHARBATI
        </text>
      </g>

      <!-- Main Heading: CHAKKI FRESH ATTA -->
      <g transform="translate(0, -42)">
        <text x="0" y="0" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#78350f" letter-spacing="1.5">
          CHAKKI FRESH
        </text>
        <text x="0" y="24" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#dc2626" letter-spacing="2">
          ATTA (আটা)
        </text>
      </g>

      <!-- Stone Chakki Illustration (পাথরের জাঁতায় ভাঙা) -->
      <g transform="translate(0, 30)">
        <!-- Lower Chakki Stone -->
        <ellipse cx="0" cy="10" rx="42" ry="12" fill="#78716c" stroke="#44403c" stroke-width="1.5" />
        <!-- Upper Chakki Stone -->
        <ellipse cx="0" cy="0" rx="40" ry="11" fill="#a8a29e" stroke="#57534e" stroke-width="1.5" />
        <!-- Wooden Handle -->
        <rect x="22" y="-16" width="6" height="18" rx="2" fill="#78350f" stroke="#451a03" stroke-width="1" />
        <circle cx="25" cy="-16" r="4" fill="#d97706" />
        <!-- Golden Grains falling around chakki -->
        <ellipse cx="-20" cy="18" rx="4" ry="2" fill="#f59e0b" transform="rotate(-15, -20, 18)" />
        <ellipse cx="0" cy="20" rx="4.5" ry="2" fill="#fbbf24" />
        <ellipse cx="20" cy="18" rx="4" ry="2" fill="#f59e0b" transform="rotate(20, 20, 18)" />
      </g>

      <!-- Quality Badges: 0% Maida • 100% Sampoorna Atta -->
      <g transform="translate(0, 92)">
        <rect x="-110" y="-10" width="220" height="22" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="900" fill="#92400e">
          0% ময়দা • ১০০% সম্পূর্ণ গম • নরম রুটি
        </text>
      </g>

      <!-- Bengali Subtitle -->
      <g transform="translate(0, 126)">
        <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#78350f">
          ঘণ্টার পর ঘণ্টা তুলতুলে নরম ও সুস্বাদু রুটি
        </text>
      </g>
    </g>

    <!-- Net Weight Stamp (Right): 10 KG / 5 KG -->
    <g transform="translate(415, 395)">
      <circle cx="0" cy="0" r="26" fill="#fbbf24" stroke="#78350f" stroke-width="2" />
      <circle cx="0" cy="0" r="23" fill="none" stroke="#78350f" stroke-width="1" stroke-dasharray="3,2" />
      <text x="0" y="-7" text-anchor="middle" font-size="7" font-weight="bold" fill="#451a03">NET WT</text>
      <text x="0" y="8" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#451a03">10 KG</text>
      <text x="0" y="16" text-anchor="middle" font-size="5.5" font-weight="bold" fill="#78350f">&amp; 5 KG PACK</text>
    </g>

    <!-- Left Badge: 100% Pure MP Wheat -->
    <g transform="translate(185, 395)">
      <circle cx="0" cy="0" r="20" fill="#991b1b" stroke="#fef08a" stroke-width="1.5" />
      <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff">100%</text>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#fde68a">PURE</text>
      <text x="0" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#ffffff">WHEAT</text>
    </g>

    <!-- Green 100% Veg Symbol -->
    <g transform="translate(425, 215)">
      <rect x="0" y="0" width="20" height="20" fill="#ffffff" stroke="#16a34a" stroke-width="2" rx="2" />
      <circle cx="10" cy="10" r="5" fill="#16a34a" />
    </g>
  </g>

  <!-- ==================== FOREGROUND: SOFT ROTIS & GOLDEN WHEAT ==================== -->
  <g transform="translate(300, 635)">
    <ellipse cx="0" cy="40" rx="140" ry="18" fill="url(#attaShadow)" />

    <!-- Traditional Brass Thali with Puffy Soft Roti (তুলতুলে ফুলকো রুটি) -->
    <ellipse cx="-70" cy="0" rx="55" ry="18" fill="#ca8a04" stroke="#78350f" stroke-width="1.5" />
    <ellipse cx="-70" cy="-6" rx="46" ry="14" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
    <!-- Soft Brown Roti Spots -->
    <ellipse cx="-78" cy="-8" rx="4" ry="2" fill="#b45309" opacity="0.6" />
    <ellipse cx="-62" cy="-4" rx="5" ry="2.5" fill="#b45309" opacity="0.5" />
    <ellipse cx="-70" cy="-10" rx="3.5" ry="1.8" fill="#b45309" opacity="0.7" />
    <text x="-70" y="24" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#fde047">ফুলকো নরম রুটি</text>

    <!-- Golden Wheat Sheaves (সোনার মতো গম) -->
    <g transform="translate(70, -10)">
      <path d="M 0 25 Q -25 -20 -40 -50" stroke="#f59e0b" stroke-width="2" fill="none" />
      <path d="M 0 25 Q 0 -30 0 -55" stroke="#f59e0b" stroke-width="2" fill="none" />
      <path d="M 0 25 Q 25 -20 40 -50" stroke="#f59e0b" stroke-width="2" fill="none" />
      <!-- Wheat Grains on Ears -->
      <ellipse cx="-35" cy="-45" rx="3.5" ry="2" fill="#fbbf24" />
      <ellipse cx="-25" cy="-35" rx="3.5" ry="2" fill="#f59e0b" />
      <ellipse cx="0" cy="-50" rx="3.5" ry="2" fill="#fef08a" />
      <ellipse cx="0" cy="-40" rx="3.5" ry="2" fill="#f59e0b" />
      <ellipse cx="35" cy="-45" rx="3.5" ry="2" fill="#fbbf24" />
      <ellipse cx="25" cy="-35" rx="3.5" ry="2" fill="#f59e0b" />
      <text x="0" y="34" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#fde047">খাঁটি শরবতী গম</text>
    </g>
  </g>

  <!-- BOTTOM AUTHENTIC STORE FOOTER -->
  <g transform="translate(300, 770)">
    <rect x="-180" y="-16" width="360" height="32" rx="8" fill="#78350f" stroke="url(#attaGold)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="13" font-weight="900" fill="#fef08a" letter-spacing="1.5">
      CHAKKI FRESH ATTA • GOPAL CHAL BHANDAR
    </text>
  </g>
</svg>
